[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aeot"
version = "2026.1"
description = "Helper functions for the practical sessions of Advanced Earth Observation Techniques (VUB)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "scikit-learn", "rasterio"]

[tool.setuptools]
packages = ["aeot"]
